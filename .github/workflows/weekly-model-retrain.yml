name: Weekly price-trend model retrain

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger retrain
        run: |
          curl --fail --show-error --silent --max-time 120 --retry 3 --retry-delay 15 \
            -X POST \
            -H "X-Backfill-Key: ${{ secrets.Steam__MarketBackfillSecret }}" \
            "https://lootbase-backend.onrender.com/api/predictions/retrain"
