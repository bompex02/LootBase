name: Steam price history backfill (batched)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# GitHub only ever runs one instance of this at a time - if a scheduled
# trigger lands while a run from an earlier trigger is still going (each run
# can last hours now), skip it instead of doubling up on the same Steam
# throttle for no extra throughput.
concurrency:
  group: steam-backfill-batch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # GitHub throttles a */5 schedule hard on low-traffic repos - real-world
      # triggers land more like every 1-5h, not every 5 minutes. Rather than
      # fight that, make each trigger that does land count: keep looping for
      # up to ~5.5h (comfortably under the 6h job ceiling) instead of a fixed
      # handful of rounds, so the rare long windows we do get are used fully.
      - name: Trigger backfill-batch repeatedly
        run: |
          deadline=$(( $(date +%s) + 5*3600 + 30*60 ))
          round=1
          while [ "$(date +%s)" -lt "$deadline" ]; do
            echo "Round $round"
            response=$(curl --fail --show-error --silent --max-time 285 --retry 2 --retry-delay 15 \
              -X POST \
              -H "X-Backfill-Key: ${{ secrets.Steam__MarketBackfillSecret }}" \
              "https://lootbase-backend.onrender.com/api/pricing/backfill-batch?currency=EUR&batchSize=55")
            echo "$response"
            remaining=$(echo "$response" | jq -r '.remaining')
            if [ "$remaining" = "0" ]; then
              echo "Nothing left to backfill."
              break
            fi
            round=$((round + 1))
          done
