name: Steam price history backfill (batched)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backfill-batch
        run: |
          curl --fail --show-error --silent --max-time 280 --retry 2 --retry-delay 15 \
            -X POST \
            -H "X-Backfill-Key: ${{ secrets.Steam__MarketBackfillSecret }}" \
            "https://lootbase-backend.onrender.com/api/pricing/backfill-batch?currency=EUR&batchSize=30"
