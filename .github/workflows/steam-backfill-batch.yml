name: Steam price history backfill (batched)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# GitHub only ever runs one instance of this at a time - if a scheduled
# trigger lands while a run from an earlier trigger is still going (each run
# can last hours now), skip it instead of doubling up on the same Steam
# throttle for no extra throughput.
concurrency:
  group: steam-backfill-batch
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # GitHub throttles the */5 schedule hard on this repo - real triggers
      # land every 1-5h, not every 5 minutes. Rather than fight that, make
      # each trigger that does land count: keep looping for up to ~5.5h
      # (comfortably under the 6h job ceiling) instead of a fixed round count.
      - name: Trigger backfill-batch repeatedly
        id: loop
        run: |
          deadline=$(( $(date +%s) + 20 ))
          round=1
          remaining=1
          while [ "$(date +%s)" -lt "$deadline" ]; do
            echo "Round $round"
            response=$(curl --fail --show-error --silent --max-time 285 --retry 2 --retry-delay 15 \
              -X POST \
              -H "X-Backfill-Key: ${{ secrets.Steam__MarketBackfillSecret }}" \
              "https://lootbase-backend.onrender.com/api/pricing/backfill-batch?currency=EUR&batchSize=55")
            echo "$response"
            remaining=$(echo "$response" | jq -r '.remaining')
            if [ "$remaining" = "0" ]; then
              echo "Nothing left to backfill."
              break
            fi
            round=$((round + 1))
          done
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      # Don't wait for GitHub's unreliable */5 schedule to fire again -
      # immediately queue the next run so windows chain back-to-back with
      # near-zero gap instead of the multi-hour gaps the schedule alone gives
      # us. Only self-chains while there's still work left.
      - name: Queue next run if not done
        if: steps.loop.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Steam price history backfill (batched)"
